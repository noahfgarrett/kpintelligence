[package]
name = "kpintelligence"
version = "0.3.1"
description = "Local-first dashboard intelligence workspaces"
authors = ["Noah Garrett"]
license = ""
repository = "https://github.com/noahfgarrett/kpintelligence"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kpintelligence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-persisted-scope = "2.3.7"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2.4.3"
tauri-plugin-updater = "2.10.1"
tauri-plugin-fs = { version = "2.5.1", features = ["watch"] }
tauri-plugin-opener = "2.5.4"
