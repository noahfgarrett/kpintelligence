name: Release desktop app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: kpintelligence-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev
      - run: npm ci
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  prepare:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:version
      - name: Resolve release metadata
        id: metadata
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual releases must run from main."
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${tag}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${tag}."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - name: Create isolated draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_TAG: ${{ steps.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          repo="noahfgarrett/kpintelligence-releases"
          release_body="$(printf 'See the in-app changelog for release details.\n\nSource revision: %s\nWorkflow run: https://github.com/%s/actions/runs/%s' "${GITHUB_SHA}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}")"
          release_id=""
          if existing_release_id="$(gh api "repos/${repo}/releases/tags/${RELEASE_TAG}" --jq '.id' 2>/dev/null)"; then
            release_id="${existing_release_id}"
          fi
          if [[ -n "${release_id}" ]]; then
            is_draft="$(gh api "repos/${repo}/releases/${release_id}" --jq '.draft')"
            if [[ "${is_draft}" != "true" ]]; then
              echo "${RELEASE_TAG} is already published."
              exit 1
            fi
            while read -r asset_id; do
              [[ -z "${asset_id}" ]] || gh api --method DELETE "repos/${repo}/releases/assets/${asset_id}"
            done < <(gh api --paginate "repos/${repo}/releases/${release_id}/assets" --jq '.[].id')
            gh api --method PATCH "repos/${repo}/releases/${release_id}" \
              -f name="KPIntelligence v${RELEASE_VERSION}" \
              -f body="${release_body}" \
              -F draft=true \
              -F prerelease=false >/dev/null
          else
            release_id="$(gh api --method POST "repos/${repo}/releases" \
              -f tag_name="${RELEASE_TAG}" \
              -f target_commitish="main" \
              -f name="KPIntelligence v${RELEASE_VERSION}" \
              -f body="${release_body}" \
              -F draft=true \
              -F prerelease=false \
              --jq '.id')"
          fi
          echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - platform: macos-14
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: npm run check:version
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
      # tauri-apps/tauri-action v1, pinned because this step receives signing credentials.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          owner: noahfgarrett
          repo: kpintelligence-releases
          releaseId: ${{ needs.prepare.outputs.release_id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseDraft: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          retryAttempts: 3
          args: ${{ matrix.args }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify installers, signatures, and updater metadata
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          repo="noahfgarrett/kpintelligence-releases"
          assets="$(gh api --paginate "repos/${repo}/releases/${RELEASE_ID}/assets" --jq '.[].name')"
          expected=(
            "KPIntelligence_${RELEASE_VERSION}_universal.dmg"
            "KPIntelligence_universal.app.tar.gz"
            "KPIntelligence_universal.app.tar.gz.sig"
            "KPIntelligence_${RELEASE_VERSION}_x64-setup.exe"
            "KPIntelligence_${RELEASE_VERSION}_x64-setup.exe.sig"
            "KPIntelligence_${RELEASE_VERSION}_x64_en-US.msi"
            "KPIntelligence_${RELEASE_VERSION}_x64_en-US.msi.sig"
            "latest.json"
          )
          if [[ "$(wc -l <<< "${assets}" | tr -d ' ')" -ne "${#expected[@]}" ]]; then
            echo "Release contains an unexpected number of assets."
            printf '%s\n' "${assets}"
            exit 1
          fi
          for asset in "${expected[@]}"; do
            if ! grep -Fxq "${asset}" <<< "${assets}"; then
              echo "Missing required release asset: ${asset}"
              exit 1
            fi
          done
          gh release download "${RELEASE_TAG}" \
            --repo "${repo}" \
            --pattern latest.json \
            --dir release-metadata
          jq -e \
            --arg version "${RELEASE_VERSION}" \
            '.version == $version
              and (.platforms["darwin-aarch64"].signature | length > 0)
              and (.platforms["darwin-x86_64"].signature | length > 0)
              and (.platforms["windows-x86_64-nsis"].signature | length > 0)' \
            release-metadata/latest.json >/dev/null
          gh release download "${RELEASE_TAG}" \
            --repo "${repo}" \
            --dir release-assets
          (
            cd release-assets
            sha256sum * > SHA256SUMS.txt
          )
          gh release upload "${RELEASE_TAG}" \
            release-assets/SHA256SUMS.txt \
            --repo "${repo}" \
            --clobber
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        shell: bash
        run: |
          gh api --method PATCH \
            "repos/noahfgarrett/kpintelligence-releases/releases/${RELEASE_ID}" \
            -F draft=false \
            -F prerelease=false \
            -f make_latest=true >/dev/null
